# MineColonies merged port — access transformers (26.1.2)
#
# PORT26 (Batch 29): entries for vanilla members that went protected/private in 26.1.2:
#  - Mob#moveControl went protected — MinecoloniesAdvancedPathNavigate assigns it on
#    foreign mobs (subclasses reach it via protected access anyway).
#  - Horse#setVariantAndMarkings went private — CavalryHorseEntity calls it directly.
#  - BaseSpawner#nextSpawnData went private — EventHandler / ShipBasedRaiderUtils read
#    and mutate the entity-to-spawn compound through it.
# NOTE: method descriptors MUST be full JVM descriptors (Lcom/pkg/Class;), as a single
# token without any spaces — a space inside the descriptor is what broke
# neoFormTransformSource in the first Batch 29 attempt.
#
# History: this port was originally AT-FREE; the two original 1.21.1 AT use cases were
# resolved in code instead:
#  - SurfaceRules$Context/updateXZ/updateY/SurfaceRule (BlockUtils#getWorldgenBlock):
#    rewritten onto the public vanilla path — CarvingContext + SurfaceSystem#topMaterial
#    (the same API NoiseBasedChunkGenerator wires up for carvers).
#  - NativeImage#pixels (blockui CursorTexture): rewritten onto getPixelsABGR().
#
# `minecraft.accessTransformers.file` in build.gradle points at this file.

public net.minecraft.world.entity.Mob moveControl
public net.minecraft.world.entity.animal.equine.Horse setVariantAndMarkings(Lnet/minecraft/world/entity/animal/equine/Variant;Lnet/minecraft/world/entity/animal/equine/Markings;)V
public net.minecraft.world.level.BaseSpawner nextSpawnData

# PORT26 (Batch 31): further members that went private in 26.1.2:
#  - StemBlock#fruit — BuildingFarmer resolves the stem's fruit block for farmer recipes.
#  - DoorBlock#playSound(Entity,Level,BlockPos,boolean) — REMOVED in Batch 32: the entry never
#    took effect on the user's build (only this one of the six failed) — EntityAIInteractToggleAble
#    now inlines the sound via the public DoorBlock#type() + Level#playSound instead.
#  - CombatTracker#entries — CitizenCombatTracker builds custom death messages.
#  - BrewingStandBlockEntity#brewTime — EntityAIWorkAlchemist drives accelerated brewing.
#  - BeehiveBlockEntity#releaseAllOccupants(BlockState,BeeReleaseStatus) — EntityAIWorkBeekeeper.
#  - BaseSpawner#requiredPlayerRange — ShipBasedRaiderUtils widens pirate ship spawner range.
public net.minecraft.world.level.block.StemBlock fruit
public net.minecraft.world.damagesource.CombatTracker entries
public net.minecraft.world.level.block.entity.BrewingStandBlockEntity brewTime
public net.minecraft.world.level.block.entity.BeehiveBlockEntity releaseAllOccupants(Lnet/minecraft/world/level/block/state/BlockState;Lnet/minecraft/world/level/block/entity/BeehiveBlockEntity$BeeReleaseStatus;)Ljava/util/List;
public net.minecraft.world.level.BaseSpawner requiredPlayerRange

# PORT26 (Batch 32): members that went private in 26.1.2:
#  - AbstractArrow#setPierceLevel(byte) — guards (ARROW_PIERCE research) and raiders shoot
#    piercing arrows; no public setter exists anymore (pierce is normally derived from the
#    weapon's Piercing enchant in the constructor).
#  - ServerLevel#entityManager + PersistentEntitySectionManager#stopTracking(EntityAccess) —
#    CitizenManager force-removes a stale citizen entity (same-UUID respawn path) before
#    re-adding it; discard() alone is processed lazily.
#  - Entity#dimensions — SittingEntity resizes seated passengers (0.5 height / baby scale)
#    by writing the field; there is no public setter.
public net.minecraft.world.entity.projectile.arrow.AbstractArrow setPierceLevel(B)V
public net.minecraft.server.level.ServerLevel entityManager
public net.minecraft.world.level.entity.PersistentEntitySectionManager stopTracking(Lnet/minecraft/world/level/entity/EntityAccess;)V
public net.minecraft.world.entity.Entity dimensions
