plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id
minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')
sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files

    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    maven {
        name = 'blamejared'
        url = 'https://maven.blamejared.com'
        content {
            includeGroup 'mezz.jei'
            includeGroup 'info.journeymap'   // tu znowu hostuje API v2 (zweryfikowane)
        }
    }
}
base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.1.2, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

//minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')
//minecraft.accessTransformers.entry public net.minecraft.client.Minecraft textureManager # textureManager
sourceSets.main.resources.srcDir 'src/main/resources-publish'
// Default run configurations.
// These can be tweaked, removed, or duplicated as needed.
runs {
    // applies to all the run configs below
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
    }

    client {
        // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    // This run config launches GameTestServer and runs all registered gametests, then exits.
    // By default, the server will crash when no gametests are provided.
    // The gametest system is also enabled by default for other run configs under the /test command.
    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    clientData {
        // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
        // workingDirectory project.file('run-data')

        // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    // JEI
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // JourneyMap: KOMPILACJA tylko przeciw standalone artefaktowi API v2 z mavena
    // (sha256-identyczny z tym w środku Twojego jara runtime).
    // NIGDY nie dawaj pełnego journeymap-neoforge-*.jar jako compileOnly → "Cannot resolve symbol 'v2'"!
    compileOnly "info.journeymap:journeymap-api-neoforge:2.0.0-26.1"
    // pełny mod TYLKO do runów dev (usuń linię, jeśli nie chcesz JM w dev):
    localRuntime files("libs/journeymap-neoforge-26.1.2-6.0.8.jar")

    // Dynamic Trees: klasy API są w jarze moda (nie ma mavena dla DT 26.1.x)
    compileOnly files("libs/dynamictrees-neoforge-26.1.2-1.8.0.jar")
    localRuntime files("libs/dynamictrees-neoforge-26.1.2-1.8.0.jar")
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.

// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_author             : mod_author,
            mod_description        : mod_description,
            neo_version_range      : neo_version_range,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}



tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.compilerArgs << '-Xlint:-removal'
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Locate bun or node on the PATH (pure JVM — works on Windows too, where 'bun' resolves
// to bun.exe / bun.cmd).
def findJsRuntime = {
    final String path = System.getenv('PATH')
    if (path == null) {
        return null
    }
    final boolean windows = System.getProperty('os.name', '').toLowerCase(java.util.Locale.ROOT).contains('windows')
    final List<String> extensions = windows ? ['', '.exe', '.cmd', '.bat'] : ['']
    for (String dir : path.split(File.pathSeparator)) {
        for (String tool : ['bun', 'node']) {
            for (String ext : extensions) {
                final File candidate = new File(dir, tool + ext)
                if (candidate.isFile()) {
                    return candidate.absolutePath
                }
            }
        }
    }
    return null
}

// Regenerates src/main/resources-publish (novel/changed lang keys vs the pristine
// upstream 1.21.1 sources — see tools/extract-novel-lang.mjs). Reference layout:
//   <portRoot>/../portsrc/<project>/src/main/resources/...   (checked-in upstream lang)
//   <portRoot>/../newer-versions/upstream-lang/assets/...    (lang extracted from the
//                                                             official jars — authoritative)



tasks.register('publishJar', Jar) {
    group = 'publishing'
    description = 'Builds the legally-clean distribution jar (only the ARR minecolonies namespace externalized; GPL mod assets stay bundled). Does NOT affect the normal build/jar tasks.'
    dependsOn 'extractNovelLang'
    archiveClassifier = 'publish'
    destinationDirectory = layout.buildDirectory.dir('publish-libs')

    // PORT26-dev-fix: sourceSets.main.output now ALSO contains resources-publish (see
    // the sourceSets.main.resources.srcDir above), and block (3) below re-includes the
    // very same files from 'src/main/resources-publish' — identical content, so the
    // duplicate entries are harmless; EXCLUDE (first-wins) keeps the jar deterministic
    // and identical to what this task produced before the srcDir change.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // 1) classes + META-INF (expanded neoforge.mods.toml, accesstransformer.cfg) + ALL
    //    GPL-licensed upstream content (structurize / domum_ornamentum / blockui /
    //    multipiston assets + data, data/minecraft merged tags) — minus the MineColonies
    //    ARR content and the upstream logo.
    from(sourceSets.main.output) {
        // ARR — minecolonies-authored content (external pack provides all of these):
        exclude 'assets/minecolonies/**'
        exclude 'assets/minecraft/textures/**'
        exclude 'data/minecolonies/**'
        exclude 'data/c/**'
        exclude 'data/dynamictrees/**'
        exclude 'data/neoforge/**'
        exclude 'blueprints/**'
        exclude 'minecolonies.png'
        // DEV-ONLY build-variant flag (BundledAssetDetector): must NEVER ship in the
        // publish jar — its presence would make the runtime report the ARR art as
        // "bundled" and silently disable the whole provisioning flow (play-test
        // regression v2: only towntalk got provisioned, minecolonies art/data never
        // downloaded, unbound damage_type registry crashed the game).
        exclude 'portassets/bundled-flag.json'
    }

    // (2) our own authored 26.1.2 atlas JSONs (assets/minecraft/atlases/**) are NOT in the
    //     exclude list above, so spec (1) already bundles them — verified NOT verbatim
    //     upstream copies; they reference 26.1.2 vanilla texture paths + our own textures.

    // 3) novel minecolonies lang keys + PORT-AUTHORED 26.1-format files + runtime conversion
    //    layer (generated by extractNovelLang / committed by the port maintainers):
    //      assets/minecolonies/lang/**            novel lang keys (extract-novel-lang.mjs)
    //      assets/minecolonies/items/**           26.1 item model definitions (port-created —
    //                                            upstream 1.21.1 has no items/ folder at all)
    //      assets/minecolonies/equipment/**       26.1 equipment models (port-created)
    //      assets/minecolonies/models/item/spear_base.json, textures/item/*egg.png,
    //      textures/block/leather.png, textures/entity/equipment/**   port-created art
    //      data/minecolonies/...                  the 11 gameplay-data files the official
    //                                            1387 CF jar is missing (cavalry research,
    //                                            blockhutstable recipe, cavalry_horse loot)
    //                                            PLUS data/minecolonies/damage_type/**
    //                                            (47 trivial functional records mirroring
    //                                            the code-registered DamageType constants:
    //                                            message_id/exhaustion/scaling only — no
    //                                            creative expression). Shipping them keeps
    //                                            minecraft:damage_type BOUND even when the
    //                                            external store is missing, so a broken or
    //                                            skipped download can never hard-crash the
    //                                            game on registry freeze again.
    //      portassets/overrides/**                port-authored conversion overrides copied
    //                                            over the user's own external store at
    //                                            extraction time (see PortAssetConverter) —
    //                                            deliberately NOT under assets/ or data/, so
    //                                            the pack scanner never sees them.
    from('src/main/resources-publish') {
        include 'assets/**'
        include 'data/**'
        include 'portassets/**'
    }

    manifest {
        attributes('Implementation-Title': mod_name,
                'Implementation-Version': mod_version)
    }
}

tasks.register('extractNovelLang', Exec) {
    group = 'publishing'
    description = 'Maintainer-only: re-diffs port lang vs pristine upstream 1.21.1 and regenerates resources-publish. Skips itself on machines without the reference layout (committed output is used instead).'
    workingDir = rootProject.projectDir

    final File novelLangScript = rootProject.file('tools/extract-novel-lang.mjs')
    final List<File> langRefRoots = [
            rootProject.file('../newer-versions/upstream-lang'),   // official-jar lang (authoritative)
            rootProject.file('../portsrc')                          // pristine upstream sources
    ]

    onlyIf {
        // explicit override: use the committed resources-publish output as-is
        if (project.hasProperty('portassets.skipLangExtract')) {
            return false
        }
        if (!novelLangScript.isFile()) {
            logger.lifecycle('extractNovelLang: tools/extract-novel-lang.mjs not present — this is not the '
                    + 'maintainer environment. publishJar will use the COMMITTED src/main/resources-publish '
                    + 'output as-is. (Regeneration is a maintainer-only workflow — see tools/extract-novel-lang.mjs.)')
            return false
        }
        if (!langRefRoots.any { it.isDirectory() }) {
            logger.lifecycle('extractNovelLang: no upstream lang reference roots found (../portsrc, '
                    + '../newer-versions/upstream-lang) — skipping regeneration so the script cannot '
                    + 'treat the committed novel-lang output as stale and delete it. publishJar will use '
                    + 'the COMMITTED src/main/resources-publish output as-is.')
            return false
        }
        return true
    }

    doFirst {
        final String jsRuntime = findJsRuntime()
        if (jsRuntime == null) {
            throw new GradleException(
                    'publishJar needs node or bun on the PATH to run tools/extract-novel-lang.mjs.\n' +
                            'Install Node.js (or Bun), or run the script manually:\n' +
                            '  node tools/extract-novel-lang.mjs\n' +
                            'then re-run gradle with -Pportassets.skipLangExtract=true')
        }
        commandLine jsRuntime, novelLangScript.absolutePath
    }
}


// ⚠️ MUSI być PONIŻEJ definicji taska publishJar — Gradle czyta plik od góry!
publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact tasks.named('publishJar').get()   // publikuje *-publish.jar (legalny)
        }
    }
    repositories {
        maven { url "file://${project.projectDir}/repo" }
    }
}


