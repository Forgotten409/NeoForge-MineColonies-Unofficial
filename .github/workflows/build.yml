name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: ARR guard (license check)
        run: node tools/check-arr-clean.mjs

      - name: Build with Gradle (publish jar)
        run: bash gradlew build publishJar

      - name: Upload publish jar
        uses: actions/upload-artifact@v4
        with:
          name: minecolonies-port-publish-jar
          path: build/publish-libs/*.jar
          if-no-files-found: error